# Opt-in PR review squad. Add the label `army:review` to a pull request to run it.
# Requires the repository secret ANTHROPIC_API_KEY. Only label pull requests you trust:
# the test engineer runs the PR's tests (credentials are scrubbed from its environment).
name: Agent Army PR review

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'army:review')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Agent Army
        run: pip install "agent-army @ git+https://github.com/${{ github.repository }}@main"
        # If you vendor agent_army into another repository, replace the line above with your install.
      - name: Run review squad
        id: army
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set +e
          army run review "Pull request: ${PR_TITLE}. Review the diff against origin/${{ github.base_ref }}." --allow-exec
          echo "code=$?" >> "$GITHUB_OUTPUT"
          army report > army-report.md
          cat army-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 army-report.md > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
      - name: Fail when the gate blocks
        if: steps.army.outputs.code != '0'
        run: exit 1
