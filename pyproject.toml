[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-army"
version = "0.1.0"
description = "A squad of specialised Claude agents that automate the software development lifecycle end to end."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
army = "agent_army.cli:main"

[tool.setuptools.packages.find]
include = ["agent_army*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
