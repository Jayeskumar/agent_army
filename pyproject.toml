[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-army"
version = "0.1.0"
description = "556 Claude agents that run the digital work of a whole office (SDLC, finance, legal, HR, sales, support, data and more), led by a commander agent and 22 pipelines with parallel squads, quality gates and fix loops."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
army = "agent_army.cli:main"

[tool.setuptools.packages.find]
include = ["agent_army*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
